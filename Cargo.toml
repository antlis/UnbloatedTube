[package]
name = "unbloatedtube"
version = "0.45.2"
edition = "2024"
description = "Lightweight, configurable YouTube desktop client: GPUI, embedded mpv, yt-dlp"
license = "AGPL-3.0-only"
repository = "https://github.com/antlis/UnbloatedTube"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json", "native-tls"] }
# OpenSSL for Settings → Network: its TLS gets through filters that stop rustls's (see src/backend/proxy.rs).
native-tls = "0.2"
sha1_smol = "1"
# DeArrow asks by a hash prefix of the video id (see src/backend/dearrow.rs).
sha2 = "0.10"
anyhow = "1"
notify-rust = "4"
# Decodes the seek bar's storyboard sheets into pixels for mpv (see src/backend/storyboard.rs): already a dependency of gpui.
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
# Blocking work (yt-dlp, HTTP, mpv's socket) runs on its own threads: already a dependency of gpui.
blocking = "1"

# What src/platform/ needs; each system gets its own implementation there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
# The video under Wayland: a subsurface of the app's window (src/platform/embed_wayland.rs), on the
# connection gpui already has; EGL and libmpv are loaded at run time. All already dependencies of gpui.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
raw-window-handle = "0.6"
libloading = "0.8"
# MPRIS (media keys): already a dependency of gpui and notify-rust.
zbus = "5"

# Fast edit-compile loop: gpui's debuginfo makes every link slow, and optimized
# deps (built once) keep `cargo run` snappy without needing --release.
[profile.dev]
debug = 0
# Light optimization of our own code keeps rendering cheap; costs ~a few seconds per rebuild.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
