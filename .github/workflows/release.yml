name: Release

# A version tag builds the Linux binary and publishes a GitHub release with it.
# "Run workflow" (workflow_dispatch) builds and uploads the archive as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    # An older image keeps the binary's glibc requirement low, so it runs on more distros.
    runs-on: ubuntu-22.04
    outputs:
      archive: ${{ steps.pkg.outputs.archive }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang libasound2-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: pkg
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="unbloated-youtube-${version}-x86_64-linux"
          mkdir "$name"
          strip -o "$name/unbloated-youtube" target/release/unbloated-youtube
          cp LICENSE README.md CHANGELOG.md packaging/unbloated-youtube.desktop packaging/unbloated-youtube.svg "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.archive }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.archive }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
        run: |
          # The tag must match Cargo.toml, or the archive would carry the wrong version.
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $VERSION"; exit 1; }
          # This version's section of the changelog is the release notes.
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
            --title "unbloated-youtube $VERSION" --notes-file notes.md

  appimage:
    # Turns the release binary into an AppImage (packaging/appimage/build.sh): the libraries it
    # links against, plus yt-dlp and deno as fallbacks; mpv has to be installed. A tag attaches it
    # to the release; "Run workflow" only uploads it as a workflow artifact.
    needs: linux-x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-x86_64.outputs.archive }}
          path: dl

      # linuxdeploy copies the libraries from this machine, so they have to be installed here.
      - name: Libraries and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 file patchelf unzip desktop-file-utils \
            libasound2 libfontconfig1 libfreetype6 libwayland-client0 libxkbcommon0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb1 libssl3 libzstd1

      - name: Build
        run: packaging/appimage/build.sh "dl/${{ needs.linux-x86_64.outputs.archive }}"

      - name: Check it
        # No library may be missing (RPATH and the system's), and the bundled tools must run.
        run: |
          appimage=$(ls unbloated-youtube-*-x86_64.AppImage)
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null
          ldd squashfs-root/usr/bin/unbloated-youtube | grep -i "not found" && exit 1 || true
          squashfs-root/usr/helpers/yt-dlp --version
          squashfs-root/usr/helpers/deno --version | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            unbloated-youtube-*-x86_64.AppImage
            unbloated-youtube-*-x86_64.AppImage.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" unbloated-youtube-*-x86_64.AppImage unbloated-youtube-*-x86_64.AppImage.sha256

  aur:
    # Publishes the new release to the AUR (unbloated-youtube-bin). Needs the AUR_SSH_KEY secret:
    # the private half of an SSH key added to the AUR account. Without it this only prints a notice.
    needs: linux-x86_64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish to the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          packaging/aur/publish.sh "$GITHUB_REF_NAME"

      - name: Not configured
        if: env.AUR_SSH_KEY == ''
        run: echo "::notice::AUR_SSH_KEY is not set, so nothing was published to the AUR"

  nix-cache:
    # Builds the Nix package once and pushes it, with its compiled dependencies, to a Cachix cache,
    # so `nixos-rebuild` downloads the app instead of compiling it. Needs the repository variable
    # CACHIX_CACHE (the cache's name) and the secret CACHIX_AUTH_TOKEN; without them this only prints
    # a notice.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        if: env.CACHIX_AUTH_TOKEN != '' && env.CACHIX_CACHE != ''

      - uses: cachix/cachix-action@v16
        if: env.CACHIX_AUTH_TOKEN != '' && env.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        if: env.CACHIX_AUTH_TOKEN != '' && env.CACHIX_CACHE != ''
        run: nix build .#default -L

      - name: Not configured
        if: env.CACHIX_AUTH_TOKEN == '' || env.CACHIX_CACHE == ''
        run: echo "::notice::CACHIX_CACHE or CACHIX_AUTH_TOKEN is not set, so nothing was pushed to a Nix cache"
